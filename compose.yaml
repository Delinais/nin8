# NINEIGHT on a Linux desktop:   docker compose up --build -d
#   logs: docker compose logs -f      stop: docker compose down
#
# Run it as your normal desktop user, from a terminal inside the desktop
# session (not with sudo - the session's DISPLAY / XAUTHORITY / XDG_RUNTIME_DIR
# are what get wired into the container). Defaults assume uid/gid 1000; run
# docker/setup.sh once if yours differ (it also checks X11 + audio).

name: nin8

services:
  nin8:
    image: nin8:local
    container_name: nin8
    build:
      context: .
      args:
        BUILD_JOBS: ${NIN8_BUILD_JOBS:-0}   # 0 = all cores; lower it if the build runs out of RAM

    # Closing the window quits the app; don't resurrect it.
    restart: "no"

    # Run as the host user. PulseAudio/PipeWire authenticates the socket by uid,
    # and the X authority file is only readable by its owner.
    user: "${NIN8_UID:-1000}:${NIN8_GID:-1000}"

    # X cookies for local connections are keyed by hostname; sharing the host's
    # UTS namespace makes the container's hostname match (KDE/XWayland, SDDM, ...).
    uts: host

    # WebKit uses a lot of shared memory; Docker's 64M default is tight.
    shm_size: 256m

    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    # The app needs no network (the UI is bundled). For strict isolation add:
    #   network_mode: none

    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /run/nin8/Xauthority
      PULSE_SERVER: unix:/run/nin8/pulse/native
      # Keep these values in sync with the volume targets below.

    volumes:
      # X11 / XWayland socket. (JUCE probes MIT-SHM and falls back to plain
      # XPutImage when the X server can't attach our shm, so no ipc: host.)
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        bind:
          create_host_path: false

      # X authority cookie. On Plasma/Wayland XAUTHORITY is /run/user/<uid>/xauth_XXXXXX.
      - type: bind
        source: ${XAUTHORITY:-${HOME}/.Xauthority}
        target: /run/nin8/Xauthority
        read_only: true
        bind:
          create_host_path: false

      # PipeWire-pulse / PulseAudio socket directory ($XDG_RUNTIME_DIR/pulse).
      - type: bind
        source: ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse
        target: /run/nin8/pulse
        bind:
          create_host_path: false

      # Persisted settings (audio device choice etc.) -> ~/.config/NINEIGHT
      - nin8-home:/home/nin8

volumes:
  nin8-home:
